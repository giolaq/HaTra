<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Habits - 2026 Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Habits</h1>
            <div class="week-selector">
                <button id="prevWeek" class="week-nav">&lt;</button>
                <span id="weekDisplay">Week 1</span>
                <button id="nextWeek" class="week-nav">&gt;</button>
            </div>
        </header>

        <div class="habit-tracker">
            <div class="habits-grid">
                <div class="grid-header">
                    <div class="habit-label-header"></div>
                    <div class="day-header">Sa</div>
                    <div class="day-header">Su</div>
                    <div class="day-header">Mo</div>
                    <div class="day-header">Tu</div>
                    <div class="day-header">We</div>
                    <div class="day-header">Th</div>
                    <div class="day-header">Fr</div>
                </div>
                <div class="grid-subheader">
                    <div class="habit-label-header"></div>
                    <div class="day-number">1</div>
                    <div class="day-number">2</div>
                    <div class="day-number">3</div>
                    <div class="day-number">4</div>
                    <div class="day-number">5</div>
                    <div class="day-number">6</div>
                    <div class="day-number">7</div>
                </div>

                <div id="habitsGrid"></div>
            </div>

            <div class="progress-section">
                <div class="progress-grid">
                    <div class="progress-header">
                        <div class="progress-label-header"></div>
                        <div class="progress-day-header">Sa</div>
                        <div class="progress-day-header">Su</div>
                        <div class="progress-day-header">Mo</div>
                        <div class="progress-day-header">Tu</div>
                        <div class="progress-day-header">We</div>
                        <div class="progress-day-header">Th</div>
                        <div class="progress-day-header">Fr</div>
                    </div>
                    <div class="progress-row">
                        <div class="progress-label">Progress</div>
                        <div class="progress-value" id="progress-0">0%</div>
                        <div class="progress-value" id="progress-1">0%</div>
                        <div class="progress-value" id="progress-2">0%</div>
                        <div class="progress-value" id="progress-3">0%</div>
                        <div class="progress-value" id="progress-4">0%</div>
                        <div class="progress-value" id="progress-5">0%</div>
                        <div class="progress-value" id="progress-6">0%</div>
                    </div>
                    <div class="progress-row">
                        <div class="progress-label">Done</div>
                        <div class="done-value" id="done-0">0</div>
                        <div class="done-value" id="done-1">0</div>
                        <div class="done-value" id="done-2">0</div>
                        <div class="done-value" id="done-3">0</div>
                        <div class="done-value" id="done-4">0</div>
                        <div class="done-value" id="done-5">0</div>
                        <div class="done-value" id="done-6">0</div>
                    </div>
                    <div class="progress-row">
                        <div class="progress-label">Not Done</div>
                        <div class="notdone-value" id="notdone-0">10</div>
                        <div class="notdone-value" id="notdone-1">10</div>
                        <div class="notdone-value" id="notdone-2">10</div>
                        <div class="notdone-value" id="notdone-3">10</div>
                        <div class="notdone-value" id="notdone-4">10</div>
                        <div class="notdone-value" id="notdone-5">10</div>
                        <div class="notdone-value" id="notdone-6">10</div>
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <canvas id="progressChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
